<head>
<meta charset="UTF-8">

<title>best app #one 5 stars</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ddd;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .screen {
    display: none;
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    min-height: 100dvh;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 32px 24px;
  }
  .screen.active { display: flex; }

  /* ── PICKER ── */
  #screen-picker { background: #fafafa; gap: 32px; }

  .picker-title {
    font-size: 22px;
    font-weight: 600;
    color: #333;
    text-align: center;
  }

  .mode-buttons { display: flex; gap: 16px; width: 100%; max-width: 280px; }

  .mode-btn {
    flex: 1;
    padding: 20px 12px;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
  }
  .mode-btn:active { transform: scale(0.95); opacity: 0.8; }
  .mode-btn.light { background: #fff7e6; color: #7a5a00; border: 2px solid #e0c060; }
  .mode-btn.dark  { background: #1a1a1a; color: #e0e0e0; border: 2px solid #444; }

  /* ── LOADER ── */
  #screen-loader { background: #fafafa; }

  .spinner {
    width: 44px; height: 44px;
    border: 4px solid #ddd;
    border-top-color: #999;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── CARD ── inner HTML owns the full surface */
  #screen-card { padding: 0; align-items: stretch; }

  /* ── 404 ── */
  #screen-404 {
    font-family: 'Times New Roman', Times, serif;
    text-align: center;
    gap: 28px;
  }
  #screen-404.light-404 { background: #fff; color: #000; }
  #screen-404.dark-404  { background: #111; color: #eee; }

  .face-404  { font-family: monospace; font-size: 30px; letter-spacing: 3px; }
  .title-404 { font-size: 20px; line-height: 1.5; max-width: 290px; }

  /* ── shared CTA ── */
  .cta-btn {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
  }
  .cta-btn:active { transform: scale(0.97); opacity: 0.85; }


</style>

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  function getCard(mode) {
    return mode === 'light'
      ? LIGHT_CARDS[Math.floor(Math.random() * LIGHT_CARDS.length)]
      : DARK_CARDS[Math.floor(Math.random() * DARK_CARDS.length)];
  }

  function get404Line(mode) {
    return mode === 'light'
      ? LIGHT_404[Math.floor(Math.random() * LIGHT_404.length)]
      : DARK_404[Math.floor(Math.random() * DARK_404.length)];
  }

  function showCta() {
    var el = document.getElementById('screen-404');
    var face = currentMode === 'light' ? '^_^' : 'X_X';
    var line = get404Line(currentMode);
    el.className = 'screen ' + (currentMode === 'light' ? 'light-404' : 'dark-404');
    el.innerHTML = '<div class="face-404">' + face + '</div><div class="title-404">' + line + '</div>';
    showScreen('screen-404');
  }

  function pickMode(mode) {
    currentMode = mode;
    showScreen('screen-loader');
    setTimeout(function () {
      var card = getCard(mode);
      document.getElementById('screen-card').innerHTML = card.render();
      showScreen('screen-card');
    }, 1300);
  }
